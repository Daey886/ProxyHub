<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#172033"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".35"/></filter>
 <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
 <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
 <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fb7185"/></marker>
 <style>
  text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#94a3b8}
  .box{filter:url(#shadow);stroke-width:2}.h{font-size:18px;font-weight:700}.p{font-size:14px;fill:#cbd5e1}.small{font-size:13px;fill:#94a3b8}
  .line{fill:none;stroke:#94a3b8;stroke-width:2.5;marker-end:url(#a)}.good{fill:none;stroke:#34d399;stroke-width:2.5;marker-end:url(#g)}.bad{fill:none;stroke:#fb7185;stroke-width:2.5;marker-end:url(#r)}
 </style>
</defs>
<rect width="1500" height="1120" fill="url(#bg)"/>
<path d="M0 130H1500M0 260H1500M0 390H1500M0 520H1500M0 650H1500M0 780H1500M0 910H1500M0 1040H1500" stroke="#243247" opacity=".3"/>
<text x="60" y="58" class="title">ProxyHub · Issue 从提交到结束的完整流程（最新版）</text>
<text x="60" y="88" class="sub">提交尽量简单；证据按需补充；所有未验证内容只进入候选流程，不直接影响正式用户</text>

<!-- 1-3 -->
<rect x="60" y="135" width="300" height="105" rx="12" fill="#083344" stroke="#22d3ee" class="box"/>
<text x="210" y="170" text-anchor="middle" class="h">① 对方提交 Issue</text><text x="210" y="197" text-anchor="middle" class="p">域名 · 请求 · 客户端版本</text><text x="210" y="222" text-anchor="middle" class="small">问题描述 · 代理/直连结果</text>
<path d="M360 187H430" class="line"/>
<rect x="430" y="135" width="300" height="105" rx="12" fill="#881337" stroke="#fb7185" class="box"/>
<text x="580" y="170" text-anchor="middle" class="h">② 自动防护</text><text x="580" y="197" text-anchor="middle" class="p">限流 · 垃圾检测 · 重复检查</text><text x="580" y="222" text-anchor="middle" class="small">不执行 Issue 内容，不读取凭据</text>
<path d="M730 187H800" class="line"/>
<rect x="800" y="135" width="300" height="105" rx="12" fill="#1e293b" stroke="#94a3b8" class="box"/>
<text x="950" y="170" text-anchor="middle" class="h">③ 自动分类与回复</text><text x="950" y="197" text-anchor="middle" class="p">triage · needs-info · duplicate</text><text x="950" y="222" text-anchor="middle" class="small">证据/日志先可选，按需补充</text>
<path d="M950 240V300H600V335" class="line"/>
<path d="M950 240V300H1270V335" class="bad"/>
<text x="610" y="292" class="small">域名规则申请，基础信息完整</text><text x="1080" y="292" class="small">垃圾、重复或明显高风险</text>

<!-- candidate -->
<rect x="430" y="335" width="340" height="110" rx="12" fill="#064e3b" stroke="#34d399" class="box"/>
<text x="600" y="371" text-anchor="middle" class="h">④ 生成候选 Draft PR</text><text x="600" y="399" text-anchor="middle" class="p">固定 SHA 的测试规则</text><text x="600" y="425" text-anchor="middle" class="small">仅供测试，不影响正式用户</text>
<path d="M770 390H840" class="line"/>
<rect x="840" y="335" width="340" height="110" rx="12" fill="#4c1d95" stroke="#a78bfa" class="box"/>
<text x="1010" y="371" text-anchor="middle" class="h">⑤ 自动检查</text><text x="1010" y="399" text-anchor="middle" class="p">域名范围 · 官方归属 · 共享 CDN</text><text x="1010" y="425" text-anchor="middle" class="small">规则测试与安全审计</text>
<path d="M1010 445V500" class="line"/>
<rect x="840" y="500" width="340" height="110" rx="12" fill="#78350f" stroke="#fbbf24" class="box"/>
<text x="1010" y="536" text-anchor="middle" class="h">⑥ AI 辅助判断</text><text x="1010" y="564" text-anchor="middle" class="p">只分析证据和检查结果</text><text x="1010" y="590" text-anchor="middle" class="small">不执行对方指令，不单独决定发布</text>
<path d="M840 555H680V650" class="good"/>
<path d="M1180 555H1300V650" class="bad"/>
<text x="690" y="620" class="small">低风险 + 检查全部通过</text><text x="1210" y="620" class="small">失败、高风险或证据冲突</text>

<!-- success -->
<rect x="480" y="650" width="400" height="115" rx="12" fill="#064e3b" stroke="#34d399" class="box"/>
<text x="680" y="687" text-anchor="middle" class="h">⑦ 对方测试候选版本</text><text x="680" y="715" text-anchor="middle" class="p">导入固定 SHA → 刷新 → 访问</text><text x="680" y="741" text-anchor="middle" class="small">回复：测试通过 / 测试失败</text>
<path d="M480 707H360V835" class="good"/>
<path d="M880 707H1000V835" class="bad"/>
<text x="365" y="790" class="small">测试通过</text><text x="1005" y="790" class="small">测试失败</text>

<rect x="120" y="835" width="410" height="110" rx="12" fill="#064e3b" stroke="#34d399" class="box"/>
<text x="325" y="871" text-anchor="middle" class="h">⑧ 复核后合并与发布</text><text x="325" y="899" text-anchor="middle" class="p">分支保护 · 必需检查 · 更新规则</text><text x="325" y="925" text-anchor="middle" class="small">回复处理结果，进入关闭流程</text>
<rect x="790" y="835" width="420" height="110" rx="12" fill="#3f1d0b" stroke="#fbbf24" class="box"/>
<text x="1000" y="871" text-anchor="middle" class="h">⑧ 保留候选，继续排查</text><text x="1000" y="899" text-anchor="middle" class="p">不合并 · 要求最少补充信息</text><text x="1000" y="925" text-anchor="middle" class="small">修正后生成新的固定 SHA 再测试</text>
<path d="M325 945V1000H570" class="good"/>
<path d="M1000 945V1000H760" class="bad"/>

<!-- close -->
<rect x="570" y="985" width="360" height="85" rx="12" fill="#0f172a" stroke="#94a3b8" class="box"/>
<text x="750" y="1019" text-anchor="middle" class="h">⑨ 回复结果 → 关闭 Issue</text><text x="750" y="1046" text-anchor="middle" class="small">已发布 / 暂不处理 / 未收到反馈</text>
<rect x="1230" y="650" width="220" height="295" rx="12" fill="#881337" stroke="#fb7185" class="box"/>
<text x="1340" y="688" text-anchor="middle" class="h">安全停止</text><text x="1340" y="723" text-anchor="middle" class="p">spam-suspected</text><text x="1340" y="751" text-anchor="middle" class="p">needs-info</text><text x="1340" y="779" text-anchor="middle" class="p">证据冲突</text><text x="1340" y="807" text-anchor="middle" class="p">AI 无法确认</text><text x="1340" y="850" text-anchor="middle" class="small">不合并、不改正式规则</text><text x="1340" y="878" text-anchor="middle" class="small">回复原因后关闭</text><text x="1340" y="906" text-anchor="middle" class="small">可重新打开或重新提交</text>
<text x="60" y="1098" class="sub">复杂部分由系统处理；对方通常只需填写 6 项信息、导入测试链接并回复测试结果。</text>
</svg>