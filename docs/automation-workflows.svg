<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">ProxyHub 自动化工作流总览</title>
  <desc id="desc">从 Issue、Pull Request、定时任务到规则检查、候选 PR 和人工审核发布的流程图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081225"/><stop offset="1" stop-color="#111b33"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#164e63"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14532d"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4c1d95"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#78350f"/><stop offset="1" stop-color="#b45309"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#67e8f9"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#24324d" stroke-width="1" opacity=".38"/></pattern>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#e5eefc}
      .title{font-size:32px;font-weight:800}.sub{font-size:16px;fill:#9fb0ca}.h{font-size:20px;font-weight:750}.p{font-size:15px;fill:#c4d2e8}.small{font-size:13px;fill:#9fb0ca}.badge{font-size:14px;font-weight:700}
      .box{stroke-width:2}.line{stroke:#67e8f9;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:9 8}
    </style>
  </defs>
  <rect width="1400" height="980" fill="url(#bg)"/>
  <rect x="28" y="28" width="1344" height="924" rx="24" fill="url(#grid)" stroke="#334155"/>
  <text x="70" y="82" class="title">ProxyHub 自动化工作流</text>
  <text x="70" y="114" class="sub">自动检查 → 生成候选变更 → 人工审核 → 发布；不会绕过审核直接修改生产规则</text>

  <!-- inputs -->
  <g filter="url(#shadow)"><rect class="box" x="70" y="170" width="265" height="155" rx="14" fill="url(#blue)" stroke="#22d3ee"/>
    <text x="95" y="208" class="h">📨 Issue 申请</text><text x="95" y="240" class="p">域名 / 规则集 / 官方证据</text><text x="95" y="267" class="p">客户端 / 现象 / 日志</text><text x="95" y="301" class="small">Triage Issues 自动分流</text></g>
  <g filter="url(#shadow)"><rect class="box" x="70" y="390" width="265" height="155" rx="14" fill="url(#blue)" stroke="#22d3ee"/>
    <text x="95" y="428" class="h">🔀 Pull Request</text><text x="95" y="460" class="p">代码、规则或文档变更</text><text x="95" y="487" class="p">创建 / 更新 / 重新打开</text><text x="95" y="521" class="small">PR Quality Gate 自动启动</text></g>
  <g filter="url(#shadow)"><rect class="box" x="70" y="610" width="265" height="155" rx="14" fill="url(#blue)" stroke="#22d3ee"/>
    <text x="95" y="648" class="h">⏰ 定时任务</text><text x="95" y="680" class="p">每小时：AI 规则同步</text><text x="95" y="707" class="p">每小时：规则安全审计</text><text x="95" y="741" class="small">每日：外部链接检查</text></g>

  <!-- processing -->
  <g filter="url(#shadow)"><rect class="box" x="475" y="235" width="300" height="210" rx="14" fill="url(#green)" stroke="#34d399"/>
    <text x="505" y="275" class="h">🧪 自动验证</text><text x="505" y="310" class="p">• 单元测试与语法检查</text><text x="505" y="337" class="p">• 域名格式与官方证据</text><text x="505" y="364" class="p">• 规则安全审计</text><text x="505" y="391" class="p">• 变更报告与链接检查</text><text x="505" y="422" class="small">失败关闭：不产生不完整结果</text></g>
  <g filter="url(#shadow)"><rect class="box" x="475" y="545" width="300" height="180" rx="14" fill="url(#purple)" stroke="#a78bfa"/>
    <text x="505" y="585" class="h">📦 生成候选变更</text><text x="505" y="620" class="p">生成各客户端规则</text><text x="505" y="647" class="p">上传审计报告 artifact</text><text x="505" y="674" class="p">创建或更新 Draft PR</text><text x="505" y="701" class="small">不直接写入 main</text></g>

  <!-- review/release -->
  <g filter="url(#shadow)"><rect class="box" x="910" y="270" width="330" height="190" rx="14" fill="url(#amber)" stroke="#fbbf24"/>
    <text x="945" y="310" class="h">👀 人工审核</text><text x="945" y="345" class="p">检查规则范围与证据</text><text x="945" y="372" class="p">确认客户端兼容性</text><text x="945" y="399" class="p">确认风险与变更报告</text><text x="945" y="434" class="badge" fill="#fde68a">通过后才可合并 main</text></g>
  <g filter="url(#shadow)"><rect class="box" x="910" y="585" width="330" height="190" rx="14" fill="#3f1d38" stroke="#fb7185"/>
    <text x="945" y="625" class="h">🚀 发布与监控</text><text x="945" y="660" class="p">人工确认版本号 RELEASE</text><text x="945" y="687" class="p">创建 tag / GitHub Release</text><text x="945" y="714" class="p">Pages 与订阅健康检查</text><text x="945" y="749" class="small">异常时告警，不自动掩盖问题</text></g>

  <!-- arrows -->
  <path class="line" d="M335 245 C390 245 410 300 475 300"/><path class="line" d="M335 465 C395 465 410 400 475 400"/>
  <path class="line" d="M335 685 C395 685 410 650 475 650"/><path class="line" d="M625 445 V545"/>
  <path class="line" d="M775 330 C840 330 850 350 910 350"/><path class="line" d="M775 635 C840 635 850 410 910 410"/>
  <path class="line" d="M1075 460 V585"/>
  <path class="line dash" d="M1240 680 C1300 680 1300 180 1240 180 C1160 130 850 150 775 270" opacity=".7"/>
  <text x="1160" y="160" class="small">持续监控 / 失败告警</text>

  <!-- footer legend -->
  <rect x="70" y="850" width="1170" height="58" rx="12" fill="#0f172a" stroke="#334155"/>
  <circle cx="105" cy="879" r="8" fill="#22d3ee"/><text x="122" y="885" class="small">输入触发</text>
  <circle cx="250" cy="879" r="8" fill="#34d399"/><text x="267" y="885" class="small">自动验证</text>
  <circle cx="400" cy="879" r="8" fill="#a78bfa"/><text x="417" y="885" class="small">候选变更</text>
  <circle cx="565" cy="879" r="8" fill="#fbbf24"/><text x="582" y="885" class="small">人工审核</text>
  <circle cx="715" cy="879" r="8" fill="#fb7185"/><text x="732" y="885" class="small">发布与告警</text>
  <text x="1010" y="885" class="small">ProxyHub · GitHub Actions</text>
</svg>
