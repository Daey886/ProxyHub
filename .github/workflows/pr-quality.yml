name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet pyyaml
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Generated rules are current
        run: python scripts/auto_update_ai.py --offline --check
      - name: Rules security audit
        run: python scripts/rules_audit.py
      - name: Generate change report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python scripts/rules_change_report.py "$BASE_SHA" > "$RUNNER_TEMP/rules-change-report.md"
      - name: Upload change report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rules-change-report
          path: ${{ runner.temp }}/rules-change-report.md
      - name: Python syntax
        run: python -m compileall -q scripts tests
      - name: JavaScript syntax
        run: node --check clash/extension-script.js
      - name: YAML and whitespace checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for p in list(Path('.github/workflows').glob('*.yml')) + list(Path('.github/workflows').glob('*.yaml')) + list(Path('.').glob('**/version.yaml')):
              yaml.safe_load(p.read_text())
              print(p)
          PY
          git diff --check
