name: Sync AI Leaderboards & Auto Update Rules

on:
  schedule:
    # 每天凌晨 04:00 (UTC) 自动执行一次爬取与同步
    - cron: '0 4 * * *'
  workflow_dispatch: # 支持在 GitHub 仓库页面手动一键触发

jobs:
  update-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Leaderboard Scraper & Rule Generator
        run: |
          python scripts/auto_update_ai.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md loon/ surge/ shadowrocket/ qx/ clash/ v2ray/
          if git diff --staged --quiet; then
            echo "No changes in AI rulesets."
          else
            git commit -m "chore(auto): dynamic sync AI leaderboards & new platforms"
            git push origin main
          fi
