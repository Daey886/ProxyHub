name: Triage Issues

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: none
  issues: write

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Classify and acknowledge issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body || ''}`.toLowerCase();
            const labels = [
              { name: 'triage', color: '7057ff', description: 'Issue awaiting maintainer review' },
              { name: 'issue:rule', color: '1d76db', description: 'Rule coverage or routing issue' },
              { name: 'issue:link', color: '0e8a16', description: 'Broken, unavailable, or stale link' },
              { name: 'issue:client', color: '5319e7', description: 'Client or platform compatibility issue' },
              { name: 'issue:feature', color: 'a2eeef', description: 'Feature request or improvement' },
              { name: 'issue:other', color: 'cfd3d7', description: 'Issue requiring manual classification' },
              { name: 'needs-info', color: 'fbca04', description: 'Waiting for minimum reproducible information' },
              { name: 'duplicate', color: 'cfd3d7', description: 'Likely duplicate of an existing issue' },
              { name: 'spam-suspected', color: 'b60205', description: 'Suspected spam or abusive submission; manual review required' },
              { name: 'candidate-approved', color: '0e8a16', description: 'Maintainer approved candidate generation' }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

            const issueBody = issue.body || '';
            const urls = issueBody.match(/https?:\/\/\S+/g) || [];
            const suspicious = issueBody.length > 12000 || urls.length > 8 || /(javascript:|<script|curl\s|wget\s|powershell|base64\s+-d)/i.test(issueBody);

            const recent = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              creator: issue.user.login,
              since: new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString(),
              per_page: 100
            });
            if (recent.length > 3 || suspicious) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['triage', 'spam-suspected']
              });
              core.warning(`Rate/content guard: recent=${recent.length}, suspicious=${suspicious}`);
              return;
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const domainMatch = issueBody.match(/(?:^|\\n)\\s*域名：?\\s*([^\\s`]+)/i);
            const domain = domainMatch ? domainMatch[1].toLowerCase().replace(/^https?:\\/\\//, '').replace(/\\/$/, '') : '';
            const duplicate = domain && openIssues.some(candidate => candidate.number !== issue.number &&
              !candidate.pull_request && `${candidate.title}\\n${candidate.body || ''}`.toLowerCase().includes(domain));
            if (duplicate) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['triage', 'duplicate']
              });
              core.info(`Possible duplicate for domain ${domain}; no candidate action.`);
              return;
            }

            const rules = [
              { label: 'issue:rule', keywords: ['规则', '分流', '侧漏', '域名', 'rule', 'routing', 'leak'] },
              { label: 'issue:link', keywords: ['链接', '失效', '打不开', '订阅', 'link', 'broken', 'unavailable', '404'] },
              { label: 'issue:client', keywords: ['loon', 'quantumult', 'surge', 'shadowrocket', 'clash', 'mihomo', 'xray', '客户端', '兼容'] },
              { label: 'issue:feature', keywords: ['建议', '功能', '增加', '希望', 'feature', 'request', 'enhancement'] }
            ];
            const matched = rules.find(rule => rule.keywords.some(keyword => text.includes(keyword)));
            const category = matched ? matched.label : 'issue:other';

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['triage', category]
            });

            const marker = '<!-- proxyhub-issue-triage -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100
            });
            if (comments.some(comment => comment.body && comment.body.includes(marker))) {
              core.info('Triage comment already exists; skipping duplicate reply.');
              return;
            }

            const body = `${marker}
            已收到域名规则申请，当前标记为 **${category}**，等待维护者核验。

            请补充（如有）：
            - 客户端及版本
            - 代理时和直连时的结果
            - 脱敏后的日志或证据链接

            在核验完成前不会直接修改生产规则，也不会自动关闭 Issue。
            请勿提交密码、Token、Cookie 或完整订阅链接。`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body
            });
