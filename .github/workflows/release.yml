name: Release validation and publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.1.15'
        required: true
        type: string
      confirm:
        description: 'Type RELEASE to publish the tag and GitHub Release'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    if: inputs.confirm == 'RELEASE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Validate version and repository
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${GITHUB_REF_NAME:-}" = main
          grep -q "SCRIPT_VERSION = \"v${VERSION}\"" clash/extension-script.js
          grep -q "v${VERSION}" clash/version.yaml
          python -m unittest discover -s tests -v
          python scripts/rules_audit.py
      - name: Create tag and release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git fetch --tags --force
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag already exists: $tag"; exit 1
          fi
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "ProxyHub $tag" --generate-notes
      - name: Purge CDN cache for version.yaml
        run: |
          # 发布后主动刷新 jsDelivr 对 @main 的缓存，让客户端版本节点尽快显示新版本号
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/clash/version.yaml" || true
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/clash/extension-script.js" || true
