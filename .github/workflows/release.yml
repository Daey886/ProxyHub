name: Release validation and publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.1.15'
        required: true
        type: string
      confirm:
        description: 'Type RELEASE to publish the tag and GitHub Release'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    if: inputs.confirm == 'RELEASE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate version and repository
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${GITHUB_REF_NAME:-}" = main
          grep -q "SCRIPT_VERSION = \"v${VERSION}\"" clash/extension-script.js
          python -m unittest discover -s tests -v
          python scripts/rules_audit.py
      - name: Create tag and release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git fetch --tags --force
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag already exists: $tag"; exit 1
          fi
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "ProxyHub $tag" --generate-notes
