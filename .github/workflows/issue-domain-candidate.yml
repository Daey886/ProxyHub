name: Build domain candidate PR

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write
  # This workflow is intentionally isolated from untrusted Issue code; only
  # validated data is written to the candidate branch.

concurrency:
  group: issue-domain-candidate-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  candidate:
    if: contains(github.event.issue.body || '', '域名') && contains(github.event.issue.body || '', '官方证据')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Verify official evidence
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: python scripts/verify_official_evidence.py "$EVENT_PATH"

      - name: Extract and validate candidate
        id: candidate
        env:
          EVENT_PATH: ${{ github.event_path }}
          CANDIDATE_FILE: scripts/community_rules.json
          SOURCES_FILE: scripts/community_sources.json
        run: |
          set -euo pipefail
          if [[ ! -f "$SOURCES_FILE" ]]; then printf '{\n  "sources": []\n}\n' > "$SOURCES_FILE"; fi
          python scripts/issue_domain_candidate.py "$EVENT_PATH" "$CANDIDATE_FILE" | tee "$RUNNER_TEMP/candidate.txt"
          grep '^candidate_added=' "$RUNNER_TEMP/candidate.txt" | cut -d= -f2- >> "$GITHUB_OUTPUT"
          grep '^candidate_target=' "$RUNNER_TEMP/candidate.txt" | cut -d= -f2- >> "$GITHUB_OUTPUT"
          grep '^candidate_evidence=' "$RUNNER_TEMP/candidate.txt" | cut -d= -f2- >> "$GITHUB_OUTPUT"

      - name: Record evidence provenance
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DOMAIN: ${{ steps.candidate.outputs.candidate_added }}
          TARGET: ${{ steps.candidate.outputs.candidate_target }}
          EVIDENCE: ${{ steps.candidate.outputs.candidate_evidence }}
          SOURCES_FILE: scripts/community_sources.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['SOURCES_FILE'])
          data = json.loads(p.read_text())
          records = [x for x in data.get('sources', []) if x.get('domain') != os.environ['DOMAIN']]
          records.append({'domain': os.environ['DOMAIN'], 'target': os.environ['TARGET'], 'evidence': os.environ['EVIDENCE'], 'issue': int(os.environ['ISSUE_NUMBER'])})
          data['sources'] = sorted(records, key=lambda x: x['domain'])
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Generate all client rules
        run: python scripts/auto_update_ai.py --offline --no-changelog

      - name: Run validation tests
        run: python -m unittest discover -s tests -v

      - name: Commit candidate rules
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DOMAIN: ${{ steps.candidate.outputs.candidate_added }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "automation/issue-domain-${ISSUE_NUMBER}"
          git add scripts/community_rules.json scripts/community_sources.json README.md loon surge shadowrocket qx clash v2ray
          git diff --cached --quiet && { echo 'No candidate change'; exit 0; }
          git commit -m "chore(candidate): add ${DOMAIN} for review"

      - name: Push candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git push --force-with-lease "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "automation/issue-domain-${ISSUE_NUMBER}"

      - name: Open or update draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DOMAIN: ${{ steps.candidate.outputs.candidate_added }}
          TARGET: ${{ steps.candidate.outputs.candidate_target }}
        run: |
          set -euo pipefail
          branch="automation/issue-domain-${ISSUE_NUMBER}"
          existing=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')
          body="候选域名：\`${DOMAIN}\`\n目标规则集：\`${TARGET}\`\n\n由 Issue #${ISSUE_NUMBER} 自动生成。\n\n这是 **Draft PR**，不会自动合并。请人工核验官方证据、共享 CDN 风险、规则分类和实际连接需求后再审核。"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$REPO" --body "$body"
          else
            gh pr create --repo "$REPO" --base main --head "$branch" --draft --title "chore(candidate): review ${DOMAIN}" --body "$body"
          fi

      - name: Acknowledge Issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- proxyhub-domain-candidate -->';
            const comments = await github.paginate(github.rest.issues.listComments, {owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number});
            if (comments.some(c => (c.body || '').includes(marker))) return;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `${marker}\n已生成候选规则 Draft PR，等待维护者审核。不会自动合并，也不会因 Issue 内容直接进入生产规则。`});
